name: PHP Tests

on:
  # 定义触发工作流的事件，例如推送代码到主分支
  push:
    branches:
      - main
  # 或者手动触发工作流
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v2

      # 设置 PHP 环境
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      # 安装 Composer 依赖
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      # 运行测试
      - name: Run tests
        run: vendor/bin/phpunit
